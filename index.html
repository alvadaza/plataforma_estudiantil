<!doctype html>
<html lang="es">

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título SEO -->
    <title>
      ABC Digital | Plataforma Educativa para Cursos, Diplomados y Formación

      content="ABC DIGITA, plataforma educativa, cursos online, diplomados, educación virtual, formación académica, estudiantes"

    <meta property="og:locale" content="es_CO" />

    <meta name="author" content="ABC Digital" />

    <!-- Canonical -->

    <!-- Favicon -->

      rel="icon"

    />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
    <meta
      property="og:title"
      content="ABC Digital | Plataforma Educativa Online"

      property="og:description"
      content="Accede a cursos, diplomados y programas académicos en línea con ABC Digital."

      property="og:image"
      content="https://res.cloudinary.com/dthi7ietr/image/upload/v1788225355/ABCDIGITAL_shwzny.png"

      name="twitter:image"
      content="https://res.cloudinary.com/dthi7ietr/image/upload/v1788225355/ABCDIGITAL_shwzny.png"
    />

    <!-- Font Awesome -->

      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
