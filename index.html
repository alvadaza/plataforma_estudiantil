<!doctype html>
<html lang="es">
  <head>
    <!-- Charset & Viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título Principal -->
    <title>
      ABC Digital STEAM | Plataforma Educativa Cursos y Formación Online
    </title>

    <!-- Meta Descripción -->
    <meta
      name="description"
      content="ABC Digital STEAM es la plataforma educativa líder en cursos, diplomados y programas de formación online con certificación. Aprende desde cualquier lugar."
    />
    <meta
      name="keywords"
      content="ABC Digital STEAM, ABC Digital, plataforma educativa, cursos online, diplomados, educación virtual"
    />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="language" content="Spanish" />
    <meta name="author" content="ABC Digital STEAM" />

    <!-- Control de Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canónica -->
    <link rel="canonical" href="https://www.abcdigitalsteam.com.co" />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/x-icon"
      href="https://res.cloudinary.com/dthi7ietr/image/upload/v1788660937/ABCDIGITALSTEAM_ebxekl.ico"
    />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
    <meta property="og:locale" content="es_CO" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ABC Digital STEAM" />
    <meta
      property="og:title"
      content="ABC Digital STEAM | Plataforma Educativa Online"
    />
    <meta
      property="og:description"
      content="Accede a cursos, diplomados y programas académicos en línea con certificación en ABC Digital STEAM."
    />
    <meta property="og:url" content="https://www.abcdigitalsteam.com.co" />
    <!-- Recomendar cambiar por un banner PNG/JPG de 1200x630 px -->
    <meta
      property="og:image"
      content="https://res.cloudinary.com/dthi7ietr/image/upload/v1788660937/ABCDIGITALSTEAM_ebxekl.ico"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ABC Digital STEAM | Educación Online" />
    <meta
      name="twitter:description"
      content="Plataforma educativa para estudiantes con cursos, diplomados y formación virtual."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/dthi7ietr/image/upload/v1788660937/ABCDIGITALSTEAM_ebxekl.ico"
    />

    <!-- DATOS ESTRUCTURADOS (Schema.org) - Clave para que Google reconozca la marca -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "ABC Digital STEAM",
        "alternateName": ["ABC Digital", "ABC Digital Colombia"],
        "url": "https://www.abcdigitalsteam.com.co",
        "logo": "https://res.cloudinary.com/dthi7ietr/image/upload/v1788660937/ABCDIGITALSTEAM_ebxekl.ico",

        "sameAs": ["https://www.facebook.com/", "https://www.instagram.com/"]
      }

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

  <body>
    <div id="root"></div>
