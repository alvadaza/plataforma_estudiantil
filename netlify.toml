[[headers.values]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com; 
      style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; 
      font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; 
      img-src 'self' data: blob: https://res.cloudinary.com https://*.cloudinary.com https://*.supabase.co https://www.google.com; 
      connect-src 'self' https://*.supabase.co https://api.cloudinary.com https://*.cloudinary.com https://www.google-analytics.com 
      https://api.emailjs.com; frame-src 'self' https://www.google.com https://www.google.com/maps https://maps.google.com 
      https://www.youtube.com https://youtube.com https://player.vimeo.com https://vimeo.com; 
      frame-ancestors 'self';
    """
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"